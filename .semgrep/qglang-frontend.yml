rules:
  # NOTE: these are single-quoted YAML strings, so `\b` reaches the regex engine
  # as a word boundary. Do NOT write `\\b` here: that is a literal backslash
  # followed by `b`, which can never match Rust source — the rule goes silently
  # dead while the gate stays green.
  - id: qglang-v2-no-runtime-sdk-index-imports
    message: QGLang v2 frontend owners must not import runtime, SDK, or index owners.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/**/*.rs
    pattern-regex: '(?m)\b(quanta_runtime|quanta_sdk|quanta_index)(::|_)'

  - id: qglang-v2-no-legacy-gqlang-imports
    message: QGLang v2 frontend owners must not import legacy quanta_gqlang_* modules.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/**/*.rs
    pattern-regex: '\bquanta_gqlang_(?!v2_)\w+'

  - id: qglang-v2-no-host-coupling-tokens
    message: Frontend crates must remain host-agnostic and must not embed backend carrier names.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/**/*.rs
    pattern-regex: '\b(SearchHost|IdeReadHost|ServingQueryRequestV1|ServingQueryResultV1|native_runtime_provider_registry_v1)\b'

  - id: qglang-v2-no-frontend-hub-bypass
    message: Frontend adapters must not bypass the transition facade for semantic-owner types.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/quanta-gqlang-v2-cli/src/**/*.rs
        - /crates/quanta-gqlang-v2-diagnostics-stdio/src/**/*.rs
    pattern-regex: '\buse\s+quanta_gqlang_v2_(?:algebra|binder|logic|modules|sema)::'

  - id: qglang-v2-no-runtime-truth-tokens
    message: Frontend source must not claim runtime execution results or backend routing truth.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/**/src/**/*.rs
    pattern-regex: '(?i)(?:\b(result_count|row_count|rows_returned|match_count|matches_found|results_found|num_results|execution_time|elapsed_ms|executed_at|ran_at|provider_response|provider_endpoint|routed_to|host_dto|host_response|backend_result|edit_applied|applied_edit|workspace_edit_applied|materialized_result|result_materialized|runtime_truth|confirmed_true|actual_result)\b|\b(rows|verdict)=)'

  - id: qglang-v2-no-silent-err-discard
    message: >-
      `Err(_) =>` silently swallows the error payload: the caller can no longer
      tell a reject from an empty result. Bind the error and surface its
      code/message (or route it into the diagnostics channel). Legacy sites are
      registered debt and carry an explicit `nosemgrep` marker.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/**/src/**/*.rs
    pattern-regex: 'Err\(_\)\s*=>'

  - id: qglang-v2-no-string-typed-error-results-in-core
    message: >-
      Core frontend owners must fail with typed, code-bearing error
      structs. `Result<_, String>` erases the error code/span and forces
      downstream layers to string-parse diagnostics.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /crates/quanta-gqlang-v2-algebra/src/**/*.rs
        - /crates/quanta-gqlang-v2-binder/src/**/*.rs
        - /crates/quanta-gqlang-v2-hir/src/**/*.rs
        - /crates/quanta-gqlang-v2-logic/src/**/*.rs
        - /crates/quanta-gqlang-v2-modules/src/**/*.rs
        - /crates/quanta-gqlang-v2-pipeline/src/**/*.rs
        - /crates/quanta-gqlang-v2-planning/src/**/*.rs
        - /crates/quanta-gqlang-v2-sema/src/**/*.rs
        - /crates/quanta-gqlang-v2-surface/src/**/*.rs
        - /crates/quanta-gqlang-v2-types/src/**/*.rs
    pattern-regex: 'Result<(?:[^<>]|<[^<>]*>){0,80},\s*String\s*>'
