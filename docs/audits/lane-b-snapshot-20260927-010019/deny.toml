[graph]
all-features = true

[advisories]
ignore  = []
version = 2

[licenses]
allow                = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93
version              = 2

[bans]
highlight         = "all"
multiple-versions = "warn"
wildcards         = "deny"

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
