[package]
edition = "2021"
name    = "quanta-gqlang-v2-surface-fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.quanta-gqlang-v2-hir]
path = "../crates/quanta-gqlang-v2-hir"

[dependencies.quanta-gqlang-v2-surface]
path = "../crates/quanta-gqlang-v2-surface"

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
bench = false
doc   = false
name  = "surface_document"
path  = "fuzz_targets/surface_document.rs"
test  = false
