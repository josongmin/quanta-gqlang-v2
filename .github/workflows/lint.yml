name: ci

on:
  push:
  pull_request:

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          components: rustfmt, clippy
          toolchain: 1.81.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: taplo-cli@0.10.0
      - name: Cargo format
        run: cargo fmt --all --check
      - name: TOML format
        run: taplo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          toolchain: 1.81.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.104
      - name: Workspace tests
        run: cargo nextest run --workspace --no-tests pass
      - name: Documentation tests
        run: cargo test --workspace --doc
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Shipped front-door parity
        run: python3 tools/test_frontdoor_parity.py

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          toolchain: 1.81.0
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-public-api@0.51.0
      - name: Architecture metadata gate
        run: python3 tools/architecture/tests/test_architecture.py && python3 tools/architecture/check_architecture.py
      - name: External facade consumer
        run: python3 tools/test_frontend_external_consumer.py

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          toolchain: 1.81.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.19.7
      - name: Supply-chain policy
        run: cargo deny check bans licenses sources advisories

  text-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: typos-cli@1.46.3
      - name: Text quality
        run: typos .

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Semgrep 1.157.0
        run: python3 -m pip install semgrep==1.157.0
      - name: Source policy
        run: python3 tools/lint/tests/test_semgrep_non_vacuity.py && tools/lint/run_semgrep.sh

  current-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          components: clippy
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Current-only Clippy policy
        run: cargo clippy --workspace --all-targets -- -D clippy::unused_result_ok -D warnings
