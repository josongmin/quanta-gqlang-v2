[package]
categories.workspace   = true
description            = "QGLang v3 logic semantics, recursion, and stratification"
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
name                   = "quanta-gqlang-v2-logic"
readme.workspace       = true
rust-version.workspace = true
version.workspace      = true

[lib]
name = "quanta_gqlang_v2_logic"
path = "src/lib.rs"

[dependencies]
quanta-gqlang-v2-hir   = { version = "0.1.0", path = "../quanta-gqlang-v2-hir" }
quanta-gqlang-v2-sema  = { version = "0.1.0", path = "../quanta-gqlang-v2-sema" }
quanta-gqlang-v2-types = { version = "0.1.0", path = "../quanta-gqlang-v2-types" }

[dev-dependencies]
# Mirrors the algebra precedent: test-only feature toggle on an already-normal
# dependency, so the final dependency DAG gains no edge.
quanta-gqlang-v2-sema = { version = "0.1.0", path = "../quanta-gqlang-v2-sema", features = [
    "test",
] }

[lints]
workspace = true
