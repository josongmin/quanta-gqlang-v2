[package]
categories.workspace   = true
description            = "Internal execution DTO, projection and canonical encoding owner"
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
name                   = "quanta-gqlang-v2-execution-contract"
readme.workspace       = true
rust-version.workspace = true
version.workspace      = true

[lib]
name = "quanta_gqlang_v2_execution_contract"
path = "src/lib.rs"

[dependencies]
quanta-gqlang-v2-algebra  = { version = "0.1.0", path = "../quanta-gqlang-v2-algebra" }
quanta-gqlang-v2-logic    = { version = "0.1.0", path = "../quanta-gqlang-v2-logic" }
quanta-gqlang-v2-planning = { version = "0.1.0", path = "../quanta-gqlang-v2-planning" }
quanta-gqlang-v2-sema     = { version = "0.1.0", path = "../quanta-gqlang-v2-sema" }
sha2                      = "=0.10.9"

[dev-dependencies]
quanta-gqlang-v2-modules = { version = "0.1.0", path = "../quanta-gqlang-v2-modules" }
quanta-gqlang-v2-sema = { version = "0.1.0", path = "../quanta-gqlang-v2-sema", features = [
    "test",
] }
quanta-gqlang-v2-surface = { version = "0.1.0", path = "../quanta-gqlang-v2-surface" }

[lints]
workspace = true
