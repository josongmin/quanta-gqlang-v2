[package]
categories.workspace   = true
description            = "QGLang v2 CLI owner"
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
name                   = "quanta-gqlang-v2-cli"
readme.workspace       = true
rust-version.workspace = true
version.workspace      = true

[lib]
name = "quanta_gqlang_v2_cli"
path = "src/lib.rs"

[[bin]]
name = "quanta-gqlang-v2-cli"
path = "src/main.rs"

[dependencies]
quanta-gqlang-v2-hir      = { version = "0.1.0", path = "../quanta-gqlang-v2-hir" }
quanta-gqlang-v2-pipeline = { version = "0.1.0", path = "../quanta-gqlang-v2-pipeline" }
quanta-gqlang-v2-planning = { version = "0.1.0", path = "../quanta-gqlang-v2-planning" }
quanta-gqlang-v2-surface  = { version = "0.1.0", path = "../quanta-gqlang-v2-surface" }
quanta-gqlang-v2-types    = { version = "0.1.0", path = "../quanta-gqlang-v2-types" }

[dev-dependencies]
quanta-gqlang-v2-diagnostics-stdio = { version = "0.1.0", path = "../quanta-gqlang-v2-diagnostics-stdio" }

[lints]
workspace = true
