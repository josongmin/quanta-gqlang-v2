# Exact manifest policy for the QGLang v2 frontend workspace.
#
# This file is the single authoritative source for what the architecture
# checker (check_architecture.py) enforces. Every allowlist here is exact:
# anything not listed is denied. The checker loads this file at startup, so
# the constants it exposes stay in sync with this policy by construction.
# Internal dependency edges are permitted maxima, not required dependencies:
# removing an allowed edge is valid; adding an unlisted edge is rejected.
#
# NOTE: internal edges are "consumer -> dependency" strings (not pairs)
# because the workspace taplo config reorders arrays; plain strings keep
# their direction under `taplo fmt`.

[workspace]
members = [
    "quanta-gqlang-v2-algebra",
    "quanta-gqlang-v2-binder",
    "quanta-gqlang-v2-cli",
    "quanta-gqlang-v2-conformance",
    "quanta-gqlang-v2-diagnostics-stdio",
    "quanta-gqlang-v2-frontend-contract",
    "quanta-gqlang-v2-hir",
    "quanta-gqlang-v2-logic",
    "quanta-gqlang-v2-modules",
    "quanta-gqlang-v2-pipeline",
    "quanta-gqlang-v2-planning",
    "quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-surface",
    "quanta-gqlang-v2-types",
]

# Exact internal edges per dependency kind. Normal, dev, and build kinds are
# independent authorities: an edge allowed as one kind is illegal as another.
[internal]
# Pinned version requirement for internal path deps (when version is present).
dev = [
    "quanta-gqlang-v2-algebra -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-logic -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-modules",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-planning -> quanta-gqlang-v2-sema",
]
normal = [
    "quanta-gqlang-v2-algebra -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-algebra -> quanta-gqlang-v2-types",
    "quanta-gqlang-v2-binder -> quanta-gqlang-v2-hir",
    "quanta-gqlang-v2-cli -> quanta-gqlang-v2-frontend-contract",
    "quanta-gqlang-v2-conformance -> quanta-gqlang-v2-frontend-contract",
    "quanta-gqlang-v2-diagnostics-stdio -> quanta-gqlang-v2-frontend-contract",
    "quanta-gqlang-v2-frontend-contract -> quanta-gqlang-v2-pipeline",
    "quanta-gqlang-v2-logic -> quanta-gqlang-v2-modules",
    "quanta-gqlang-v2-logic -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-logic -> quanta-gqlang-v2-types",
    "quanta-gqlang-v2-modules -> quanta-gqlang-v2-hir",
    "quanta-gqlang-v2-modules -> quanta-gqlang-v2-types",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-algebra",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-logic",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-planning",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-pipeline -> quanta-gqlang-v2-surface",
    "quanta-gqlang-v2-planning -> quanta-gqlang-v2-algebra",
    "quanta-gqlang-v2-planning -> quanta-gqlang-v2-logic",
    "quanta-gqlang-v2-planning -> quanta-gqlang-v2-sema",
    "quanta-gqlang-v2-planning -> quanta-gqlang-v2-types",
    "quanta-gqlang-v2-sema -> quanta-gqlang-v2-binder",
    "quanta-gqlang-v2-sema -> quanta-gqlang-v2-hir",
    "quanta-gqlang-v2-sema -> quanta-gqlang-v2-modules",
    "quanta-gqlang-v2-sema -> quanta-gqlang-v2-types",
    "quanta-gqlang-v2-surface -> quanta-gqlang-v2-hir",
    "quanta-gqlang-v2-types -> quanta-gqlang-v2-hir",
]
version = "0.1.0"
# Build scripts execute code during compilation, so no internal build edge is
# admitted. Additions require an explicit entry here with architecture review.
build = []

# Internal path dependencies must enable no features by default. Keys are
# "consumer|kind|dependency"; the value lists every feature that edge may
# enable. Any feature not listed here is feature drift and is rejected.
[internal.allowed_features]
"quanta-gqlang-v2-algebra|dev|quanta-gqlang-v2-sema"  = ["test"]
"quanta-gqlang-v2-logic|dev|quanta-gqlang-v2-sema"    = ["test"]
"quanta-gqlang-v2-pipeline|dev|quanta-gqlang-v2-sema" = ["test"]
"quanta-gqlang-v2-planning|dev|quanta-gqlang-v2-sema" = ["test"]

# Exact external (non-workspace) allowlists per crate per kind. A crate with
# no table for a kind admits no external dependency of that kind. In
# particular every crate denies all external build dependencies (default
# deny). Each entry pins the exact version requirement and the exact feature
# set; any deviation is drift and is rejected.
[external.normal."quanta-gqlang-v2-modules"]
sha2 = { version = "=0.10.9", features = [] }

[external.normal."quanta-gqlang-v2-cli"]
libc = { version = "=0.2.186", features = [] }

[external.normal."quanta-gqlang-v2-pipeline"]
sha2 = { version = "=0.10.9", features = [] }

[external.normal."quanta-gqlang-v2-diagnostics-stdio"]
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }

[external.dev."quanta-gqlang-v2-pipeline"]
proptest = { version = "=1.8.0", features = [] }

[external.dev."quanta-gqlang-v2-surface"]
proptest = { version = "=1.8.0", features = [] }
# Test-only pin for the example corpus byte manifest.
sha2 = { version = "=0.10.9", features = [] }

# Manifest hygiene enforced on every workspace member manifest.
[hygiene]
# Every member manifest must contain exactly `[lints] workspace = true`.
require_lints_workspace = true
# No member may run a custom build script (crate-root build.rs or a
# `build` key in [package]).
deny_custom_build = true
# No `[target.*]` dependency sections; all deps are unconditional.
deny_target_sections = true
# No renamed (`package = ...`), optional, or default-features-off deps.
deny_default_features_drift = true
deny_optional               = true
deny_renames                = true
