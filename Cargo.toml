[workspace]
members = [
    "crates/quanta-gqlang-v2-algebra",
    "crates/quanta-gqlang-v2-binder",
    "crates/quanta-gqlang-v2-cli",
    "crates/quanta-gqlang-v2-conformance",
    "crates/quanta-gqlang-v2-diagnostics-stdio",
    "crates/quanta-gqlang-v2-execution-contract",
    "crates/quanta-gqlang-v2-frontend-contract",
    "crates/quanta-gqlang-v2-hir",
    "crates/quanta-gqlang-v2-logic",
    "crates/quanta-gqlang-v2-modules",
    "crates/quanta-gqlang-v2-pipeline",
    "crates/quanta-gqlang-v2-planning",
    "crates/quanta-gqlang-v2-sema",
    "crates/quanta-gqlang-v2-surface",
    "crates/quanta-gqlang-v2-types",
]
resolver = "2"

[workspace.package]
authors      = ["Song Min"]
categories   = ["compilers", "development-tools", "parser-implementations"]
edition      = "2021"
keywords     = ["compiler", "diagnostics", "gqlang", "query-language", "static-analysis"]
license      = "MIT OR Apache-2.0"
readme       = "README.md"
rust-version = "1.81.0"
version      = "0.1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub  = "deny"
unsafe_code      = "forbid"
unused_imports   = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -3 }
# `unused_result_ok` is unavailable on the 1.81 MSRV and is therefore enforced
# explicitly by the pinned 1.95 current-policy Clippy lane.
allow_attributes                   = "deny"
allow_attributes_without_reason    = "deny"
as_conversions                     = "warn"
cargo                              = { level = "warn", priority = -2 }
cargo_common_metadata              = "allow"
cast_lossless                      = "warn"
cast_possible_truncation           = "deny"
cast_possible_wrap                 = "deny"
cast_precision_loss                = "deny"
cast_sign_loss                     = "deny"
checked_conversions                = "warn"
dbg_macro                          = "deny"
exit                               = "deny"
expect_used                        = "deny"
fn_to_numeric_cast_any             = "deny"
indexing_slicing                   = "deny"
let_underscore_must_use            = "deny"
map_err_ignore                     = "deny"
match_wildcard_for_single_variants = "deny"
missing_const_for_fn               = "allow"
missing_errors_doc                 = "allow"
missing_panics_doc                 = "allow"
module_name_repetitions            = "allow"
modulo_arithmetic                  = "warn"
multiple_crate_versions            = "allow"
must_use_candidate                 = "allow"
nursery                            = { level = "allow", priority = -1 }
panic                              = "deny"
panic_in_result_fn                 = "deny"
pedantic                           = { level = "allow", priority = -1 }
print_stderr                       = "allow"
print_stdout                       = "allow"
todo                               = "deny"
too_many_arguments                 = "allow"
too_many_lines                     = "warn"
unimplemented                      = "deny"
unwrap_used                        = "deny"
wildcard_enum_match_arm            = "deny"
wildcard_imports                   = "deny"
