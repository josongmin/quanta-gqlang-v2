[workspace]
members = [
    "crates/quanta-gqlang-v2-cli",
    "crates/quanta-gqlang-v2-conformance",
    "crates/quanta-gqlang-v2-ir",
    "crates/quanta-gqlang-v2-lsp",
    "crates/quanta-gqlang-v2-sema",
    "crates/quanta-gqlang-v2-syntax",
]
resolver = "2"

[workspace.package]
authors      = ["Song Min"]
categories   = ["compilers", "development-tools", "parser-implementations"]
edition      = "2021"
keywords     = ["compiler", "gqlang", "lsp", "query-language", "static-analysis"]
license      = "MIT OR Apache-2.0"
readme       = "README.md"
rust-version = "1.81"
version      = "0.1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub  = "deny"
unsafe_code      = "forbid"
unused_imports   = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -3 }
# `allow_attributes` (prefer #[expect] over #[allow]) and `_without_reason` both
# stay denied. The linted surface (`--lib --bins --examples`) carries no allow
# attributes; the reasoned `#![allow(...)]` blocks in integration tests live in
# `--tests` targets, which this lint gate does not compile, so the strict policy
# holds without weakening test ergonomics.
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
as_conversions                  = "warn"
cargo                           = { level = "warn", priority = -2 }
cargo_common_metadata           = "allow"
cast_lossless                   = "warn"
cast_possible_truncation        = "deny"
cast_possible_wrap              = "deny"
cast_precision_loss             = "deny"
cast_sign_loss                  = "deny"
checked_conversions             = "warn"
dbg_macro                       = "deny"
expect_used                     = "deny"
indexing_slicing                = "deny"
missing_const_for_fn            = "allow"
missing_errors_doc              = "allow"
missing_panics_doc              = "allow"
module_name_repetitions         = "allow"
modulo_arithmetic               = "warn"
multiple_crate_versions         = "allow"
must_use_candidate              = "allow"
nursery                         = { level = "allow", priority = -1 }
panic                           = "deny"
panic_in_result_fn              = "deny"
pedantic                        = { level = "allow", priority = -1 }
print_stderr                    = "allow"
print_stdout                    = "allow"
todo                            = "deny"
too_many_arguments              = "allow"
unimplemented                   = "deny"
unwrap_used                     = "deny"
wildcard_imports                = "deny"
